services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-guard-db
    environment:
      POSTGRES_DB: inventory_guard
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - inventory-guard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inventory-guard-data: