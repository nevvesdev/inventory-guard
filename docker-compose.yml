services:
  postgres:
    image: postgres:16-alpine
    container_name: inventory-guard-db
    environment:
      POSTGRES_DB: inventory_guard
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    ports:
      - "5432:5432"
    volumes:
      - inventory-guard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_guard"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: inventory-guard-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/inventory_guard
      DB_USERNAME: inventory
      DB_PASSWORD: inventory
      STOCK_STRATEGY: conditional-update
    ports:
      - "8080:8080"

volumes:
  inventory-guard-data: